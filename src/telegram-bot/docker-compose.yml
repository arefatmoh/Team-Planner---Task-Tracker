version: '3.8'

services:
  # Telegram Bot Service
  telegram-bot:
    build: .
    container_name: umrago-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    command: python umrago_bot.py
    networks:
      - umrago-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Webhook API Service
  webhook-api:
    build: .
    container_name: umrago-webhook-api
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - PORT=5000
    command: python webhook_api.py
    networks:
      - umrago-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  umrago-network:
    driver: bridge
